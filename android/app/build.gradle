plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
android {
    namespace = "com.example.camapp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.logiclegends.saarthi"
        // flutter_gemma's LiteRT-LM inference engine requires API 30+; this
        // raises the floor above Flutter's own default minSdk.
        minSdkVersion = 30
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // Debug signing so `flutter build apk --release` works without a keystore.
            signingConfig = signingConfigs.debug
            // ML Kit's text-recognition lib references the CJK/Devanagari
            // recognisers we don't bundle; R8 fails on the missing classes.
            // We ship a test build, not an optimised store release — skip
            // shrinking rather than maintain keep rules for it.
            minifyEnabled = false
            shrinkResources = false
        }
    }
}



flutter {
    source = "../.."
}
